# =====================================================================
# Parking Spotter — non-secret configuration (safe to commit).
# Secrets live in .env (gitignored). See .env.example.
# =====================================================================

# Live channels exposed by /cameras. Keys = RTSP channel number, value = label.
# Config-driven: add/remove a camera by editing this map (no code change).
cameras:
  1: "Sokak"
  4: "Giriş"
  3: "Bahçe"

rtsp:
  port: 554
  # {channel} and {subtype} are filled in at runtime.
  path_template: "/cam/realmonitor?channel={channel}&subtype={subtype}"
  transport: tcp            # tcp is more reliable than udp for the XVR
  timeout_seconds: 30       # generous: recorder can be slow to first frame

capture:
  method: auto              # auto | snapshot | rtsp (Phase 4). auto = try the HTTP
                            # snapshot first, fall back to ffmpeg on error,
                            # invalid JPEG, or a size mismatch (ROI safety check).
  viewer_subtype: 1         # substream (light) for /cameras quick glance
  detect_subtype: 0         # mainstream (full detail) for /parking + push
  jpeg_quality: 2           # ffmpeg -q:v, lower = better quality
  snapshot_timeout_seconds: 10

detection:
  # In Docker, /app/models is mounted from /mnt/models (the dedicated models
  # disk), so this resolves to /mnt/models/yolov8n.onnx. For non-Docker runs,
  # set PARKING_MODEL_PATH=/mnt/models/yolov8n.onnx (env overrides this).
  model_path: "models/yolov8n.onnx"
  input_size: 640
  conf_threshold: 0.25      # min detection confidence; dark cars score low,
                            # and the ROI-overlap gate rejects off-spot vehicles
  nms_iou: 0.45
  # COCO vehicle class ids: car=2, motorcycle=3, bus=5, truck=7
  vehicle_classes: [2, 3, 5, 7]
  # A spot is OCCUPIED if a vehicle box covers at least this fraction of the ROI.
  roi_overlap_threshold: 0.15
  # Per-spot ROI crop pass (plan §6). Some spots only detect on the full frame,
  # others only on the cropped ROI — we run both and take the best coverage.
  crop_detect: true
  crop_pad: 0.15            # expand the ROI bbox by this fraction before cropping
  crop_upscale: 2.0         # upscale the crop to make mid/far/dark cars bigger

# The two parking spots. Each ROI polygon is in ITS OWN frame's pixel coords.
# Tuned against real frames (2026-06-30). Coordinates are [x, y] pixel pairs.
spots:
  - name: "Ön (sarı ev)"     # Spot A — ch1, near SUV against the curb
    channel: 1
    frame_size: [960, 1080]  # expected mainstream size (informational)
    polygon: [[285, 425], [510, 435], [505, 815], [295, 805]]
    # ch3 also sees this spot (the nearer of the two cars on the right). Used by SPOT_WATCH
    # only as a veto: if ch1 says free but ch3 still sees a car, the alert is held.
    # ch3 is NOT reliable alone (30 h replay: finds the car 15-18/40 times), hence a veto.
    cross_check:
      channel: 3
      frame_size: [960, 576]
      polygon: [[590, 300], [790, 300], [790, 415], [590, 415]]

  - name: "ev önü"          # Spot B — ch3, large dark car (top-down)
    channel: 3
    frame_size: [960, 576]
    polygon: [[20, 150], [540, 175], [545, 375], [30, 360]]

push:
  enabled: true
  interval_minutes: 10        # base poll cadence (Phase 5: was 30)
  confirm_interval_minutes: 2 # adaptive: while a flip is pending, re-poll this often
                             # until the debounce resolves (3 x 2 min = ~6 min latency)
  debounce_frames: 3         # consecutive agreeing polls before flipping state.
  # Decision: notify ONCE when a spot transitions to FREE, then stay quiet.
  policy: free_only          # free_only | all_changes
  # Optional night hours (Phase 5): longer interval at night for less CPU/noise.
  # 0 disables. Range wraps midnight (23 -> 06).
  night_interval_minutes: 0
  night_start_hour: 23
  night_end_hour: 6
  # Debounce/transition state is persisted here (atomic write) so a container
  # restart mid-cycle does not lose the confirmed state or re-baseline.
  # Relative paths resolve against the repo root (/app/data in Docker).
  state_path: "data/push_state.json"
  # On startup, restore the saved state only if it is newer than this many
  # hours; otherwise the first reading sets a fresh baseline.
  state_max_age_hours: 24

# Second-opinion visual verification with a LOCAL vision model (ollama).
# Two jobs: (1) GATE — before sending a "BOŞ/empty" alert, ask the VLM whether the spot
# is really empty; if it sees a car, suppress the alert (kills the night false positives
# where YOLO misses dark/top-down cars). (2) AUDIT — every poll, log bot-vs-VLM agreement
# so /accuracy can report how trustworthy the bot is.
verify:
  enabled: true       # Phase 6 (2026-10-01): VLM gate via AI Gate -> Groq vision.
                      # Local ollama was unviable on this box (2026-07-01); the gate now runs
                      # in the CLOUD via AI Gate (explicit opt-in: ROI crops leave the LAN).
  backend: aigate
  ollama_url: "http://localhost:11434"   # env OLLAMA_URL overrides (Docker: host.docker.internal)
  model: "moondream"                      # ollama model (only used when backend: ollama)
  timeout_seconds: 90
  gate: true          # suppress a FREE alert if the VLM says the spot is occupied
  audit: false        # OFF: the audit would send a crop to the cloud EVERY poll
                      # (144/day). The GATE alone runs only on pending free flips
                      # (a few/day). /accuracy uses feedback.jsonl (Phase 1).
  fail_open: true     # if the VLM is unreachable, SEND the alert (tagged) rather than lose a real free
  crop_pad: 0.15      # expand the ROI bbox by this fraction before cropping (matches detector)
  # AI Gate backend (Groq vision model). Caller + model configured in AI Gate.
  aigate_url: "http://localhost:8500"            # AI Gate is network_mode: host (this container is too)
  aigate_caller_id: "parking-spotter"
  aigate_model: "qwen/qwen3.8-27b"
  max_tokens: 200
  # Writable path for the accuracy log. Relative paths resolve against the repo root.
  # NOT /mnt/models — that disk is mounted read-only in Docker.
  log_path: "data/parking-accuracy.jsonl"
  # Size-based rotation for the accuracy log (Phase 0 task 2): rotate when the
  # file would exceed log_max_mb, keep log_keep generations (.1, .2, ...).
  log_max_mb: 10
  log_keep: 3

inference:
  omp_num_threads: 2         # cap CPU threads on the i3-4170

# Human feedback (Phase 1): ✅/❌ buttons on alerts + /parking results, labeled
# ROI crops for the Phase 7 fine-tune dataset, and a feedback-based /accuracy
# report. Default off until Phase 1 is accepted.
feedback:
  enabled: true               # Phase 1 accepted 2026-09-29 (see DECISIONS.md)
  max_frames: 2000           # retention cap on data/frames/*.jpg (oldest deleted)
  frames_dir: "data/frames"
  jpeg_quality: 85

# Stability ("no motion") gate (Phase 2): when YOLO says FREE but the spot was
# confirmed OCCUPIED and the ROI is unchanged vs the last occupied reference crop,
# override to OCCUPIED (stable_override) — kills the night false-"BOŞ" where YOLO
# misses a car that is still there. Default off until Phase 2 is accepted.
stability:
  enabled: true                # Phase 2 accepted 2026-09-29 (see DECISIONS.md)
  similarity_threshold: 0.45  # edge-NCC threshold; tuned via offline replay 2026-09-29
                              # (occupied pairs 0.64-0.78, departures 0.19-0.26).
                              # Lower than the plan's 0.85 suggestion because IR
                              # night pairs score lower; tunable — revisit after the
                              # live week (day-ref vs night-current is the real case).
  max_ref_age_hours: 12       # ignore references older than this
  ref_width: 160              # reference crop width in px
  min_coverage: 0.5           # refresh the reference when a reading is occupied
                              # with coverage >= this (strong occupied signal)

# Tier-2 detector (Phase 3): a bigger model (yolov8s) used ONLY on the rare
# pending-free path, with a lower confidence threshold, behind a RAM guard.
# The session is unloaded after each use. Default off until Phase 3 is accepted.
detection_tier2:
  enabled: true               # Phase 3 accepted 2026-09-30 (see DECISIONS.md)
  model_path: "models/yolov8s.onnx"
  conf_threshold: 0.15
  min_available_mb: 2500      # defer the free alert below this host MemAvailable

# Spot Watch (SPOT_WATCH mode): alert as soon as a watched spot becomes free.
# Both spots above are watched independently. Replaces the push loop when enabled.
# No image/video is ever written to disk by this mode; the alert snapshot is
# encoded in RAM and sent straight to Telegram (decision D1).
spotwatch:
  enabled: true
  interval_seconds: 60          # base cadence (30-120)
  confirm_delay_seconds: 10     # a free reading is re-checked this soon (debounce)
  confirm_reads: 2              # consecutive free readings required
  remind_every_minutes: 10      # reminders while still free ...
  remind_max: 3                 # ... at most this many
  send_snapshot: true           # D1: snapshot from RAM attached to the alert
  snapshot_quality: 80
  subtype: 0                    # mainstream: the ROI polygons are in main-stream pixels
  fail_threshold: 3             # consecutive grab failures before "camera unreachable"
  backoff_max_seconds: 480
  state_db: "state/spotter.db"  # SQLite: mode, settings, tracker state (never images)
  state_max_age_hours: 12       # restore tracker state on restart only if this fresh
  cross_max_veto_minutes: 10    # if ch1 and ch3 disagree this long, stop vetoing and alert
  timezone: "Europe/Istanbul"   # camera clock is UTC+3; also used for "night"

# GUARD mode: watch the owner's parked car for suspicious activity (Phase 2).
# /guard asks which spot the car is in, finds it (median of ~5 reads) and builds a
# car zone + perimeter. The pipeline runs on the SUBSTREAM (352x288 @ <=7 fps on this
# XVR) and only runs YOLO while there is motion / an XVR event / a live track.
# No image or video is written to disk: frames stay in RAM, evidence is JPEG-encoded
# in memory only when an alert fires.
guard:
  enabled: true
  # Small static-input YOLOv8n export (320). Lives on the user-writable storage disk and
  # is mounted read-only at /app/models-guard (see docker-compose.yml).
  model_path: "models-guard/yolov8n_320.onnx"
  model_threads: 1              # 1 thread on the pinned core (2nd hyperthread gains ~10-15 %)
  conf: 0.30
  detect_fps: 4                 # max YOLO rate while active; the limiter lowers it 4->2->1
  tail_seconds: 10              # keep detecting this long after the last motion/event
  gate: both                    # motion | xvr | both (OR). XVR delay/night reliability unmeasured
  xvr_codes: [SmartMotionHuman] # vehicle events fire every few s on a street; every rule here is about people
  gate_min_frac: 0.004          # share of the perimeter crop that must change
  gate_global_frac: 0.40        # more than this changing at once = headlights/IR switch: ignored
  perimeter_dilate_w: 0.40      # perimeter = car zone +40 % width ...
  perimeter_dilate_h: 0.25      # ... +25 % height
  # perimeters:                 # optional manual polygon per spot, in MAIN-stream pixels
  #   "ev önü": [[x, y], [x, y], [x, y], [x, y]]
  duty_limit: 0.40              # max share of any 60 s the detector may be busy
  duty_window_seconds: 60
  recover_after_seconds: 300
  alert_repeat_seconds: 30      # ALERT repeats until /ack (D7) ...
  alert_repeat_max: 10          # ... at most this many times
  cooldown_seconds: 60          # min gap between alerts of the same rule
  evidence_seconds: 8           # RAM ring buffer of raw frames (never persisted)
  evidence_prev_frames: 3
  followup_main_snapshot: true  # one main-stream photo after an alert (substream is tiny)
  rules:
    loiter_seconds: 10          # person inside the perimeter this long -> WARNING
    contact_seconds: 3          # person box overlapping the car this long -> ALERT
    multi_seconds: 2            # 2+ people inside the perimeter -> WARNING
    contact_overlap: 0.10       # share of the person's box inside the car box
    night_factor: 0.6           # durations x0.6 at night (10 s -> 6 s)
  # CAR_GONE / departure (substream presence check, confirmed on the main stream)
  presence_check_seconds: 5     # compare the car zone to its reference this often (no YOLO)
  gone_similarity: 0.30         # zone similarity below this is suspicious ...
  gone_checks: 3                # ... for this many checks in a row (~15 s), then confirm
  gone_confirm_reads: 2         # main-stream reads that must ALL miss the car
  departure_seconds: 90         # paused + absent this long = the owner drove off -> SPOT_WATCH
  gone_reply_seconds: 120       # no [Bendim]/[Ben değilim] reply -> repeat louder (ACİL)
  gone_repeat_escalated_seconds: 15
  night:                        # decision D8
    mode: sun                   # sun (sunset-sunrise for lat/lon) | fixed (local hours)
    lat: 41.0
    lon: 29.0
    margin_minutes: 30          # IR switches on well before sunset
    start_hour: 19              # used when mode: fixed
    end_hour: 6

# Automatic mode switching ("teach the car"): /enroll stores appearance VECTORS of the owner's
# car per spot and condition (day / night-IR / rain); when a new car parks in a watched spot
# it is matched against them. Needs /auto on. Crops are never stored.
auto:
  enabled: true
  settle_seconds: 20            # let the car finish parking before judging it
  reads: 3                      # main-stream reads per arrival (median score is used)
  read_gap_seconds: 5
  ask_timeout_seconds: 300      # D5: unanswered "is this your car?" -> GUARD with a notice
  undo_window_seconds: 600      # [Bu benim arabam değil] stays valid this long after an auto switch
  enroll_samples: 15
  enroll_gap_seconds: 2
  enroll_min_found: 10          # fewer reads with the car visible -> nothing is stored
  box_area_ratio: [0.4, 1.2]    # car box / spot-polygon bbox; outside = junk detection (rejected)
  match:
    # Tuned on 30 h of real ch1/ch3 crops: the owner's car scored 0.86-0.99 against same-condition
    # references, other cars <= 0.65; an IR query vs daylight refs scored ~0.70 vs <= 0.49.
    # Hard negatives (the same model parking in the same spot) are UNTESTED, so t_hi is high
    # and everything uncertain asks instead of switching.
    t_hi: 0.92                  # >= auto-switch to GUARD (never with < min_refs references)
    t_lo: 0.75                  # >= ask "is this your car?"; below = another car, ignored
    cross_condition_t_lo: 0.55  # IR query vs daylight-only references: ask above this, never auto
    top_k: 3
    min_refs: 5
    negative_pull: 0.15
    geom_weight: 0.25
