services:
  parking-spotter:
    build: .
    image: parking-spotter:latest
    container_name: parking-spotter
    restart: unless-stopped

    # Secrets are injected from the gitignored .env file — never baked into the
    # image and never committed. Copy .env.example -> .env first.
    env_file:
      - .env

    # AI Gate runs on the HOST with network_mode: host; put this container on the
    # host network too so it can reach AI Gate (and ollama) via localhost.
    network_mode: host

    volumes:
      # ONNX weights live on the dedicated models disk (/mnt/models), NOT in the
      # repo or image — the root disk is small. Mounted read-only at /app/models.
      - /mnt/models:/app/models:ro
      # Live-editable config (ROI polygons, cameras, tuning) without rebuilding.
      - ./config.yaml:/app/config.yaml:ro
      # Writable data dir (accuracy log, feedback, push state, frame crops).
      # On the dedicated storage volume — NOT the root SSD, NOT the read-only
      # /mnt/models mount. Phase 0 task 1.
      - /mnt/storage/parking-spotter/data:/app/data
      # SQLite state only (mode, settings, per-spot tracker state) -- never images.
      - /mnt/storage/parking-spotter/state:/app/state

    # No-disk guarantee for Spot Watch / Guard: the container rootfs is read-only
    # (frames live in RAM and ffmpeg pipes only). The only writable mounts are the
    # /app/data and /app/state volumes above/below; the SQLite state never holds
    # images. Deliberately NO tmpfs for /tmp.
    read_only: true

    # Modest box (i3-4130 / 8GB). Pin to ONE physical core (CPUs 0 and 2 are the
    # two hyperthreads of core 0; see `lscpu -e`) so Jellyfin/Nextcloud keep the
    # other. A cpuset instead of a CFS quota (`cpus:`) -- a hard quota throttles
    # in short bursts, which is bad for a latency-sensitive detector.
    cpuset: "0,2"
    mem_limit: 700m
    memswap_limit: 700m      # equal to mem_limit => no swap

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
